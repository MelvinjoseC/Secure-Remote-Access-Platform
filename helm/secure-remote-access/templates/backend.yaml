apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secure-remote-access.fullname" . }}-backend
  labels:
    {{- include "secure-remote-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: SIGNALING_API_URL
              value: "http://{{ include "secure-remote-access.fullname" . }}-signaling:{{ .Values.signaling.service.port }}"
            - name: SIGNALING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: SIGNALING_API_KEY
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secure-remote-access.fullname" . }}-backend
  labels:
    {{- include "secure-remote-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-backend
