apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secure-remote-access.fullname" . }}-signaling
  labels:
    {{- include "secure-remote-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
spec:
  replicas: {{ .Values.signaling.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-signaling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-signaling
    spec:
      containers:
        - name: signaling
          image: "{{ .Values.signaling.image.repository }}:{{ .Values.signaling.image.tag }}"
          imagePullPolicy: {{ .Values.signaling.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.signaling.service.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.signaling.service.port }}"
            - name: SIGNALING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: SIGNALING_API_KEY
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: AGENT_AUTH_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "secure-remote-access.fullname" .)) .Values.secrets.existingSecret }}
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.signaling.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.signaling.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.signaling.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secure-remote-access.fullname" . }}-signaling
  labels:
    {{- include "secure-remote-access.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
spec:
  type: {{ .Values.signaling.service.type }}
  ports:
    - port: {{ .Values.signaling.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "secure-remote-access.name" . }}-signaling
