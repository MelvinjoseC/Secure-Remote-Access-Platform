{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secure-remote-access.fullname" . }}-secrets
  labels:
    {{- include "secure-remote-access.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  SIGNALING_API_KEY: {{ .Values.secrets.signalingApiKey | quote }}
  AGENT_AUTH_TOKEN: {{ .Values.secrets.agentAuthToken | quote }}
{{- end }}
